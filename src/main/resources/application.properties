# ==========================================
# APPLICATION CONFIG
# ==========================================
spring.application.name=career-navigator
server.port=8080

# ==========================================
# MYSQL DATABASE CONFIG
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/career_navigator_db
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE CONFIG
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# JWT CONFIG
# ==========================================
jwt.secret=careernavigator_super_secret_key_2024_minimum_256_bits_long
jwt.expiration=86400000

# ==========================================
# LOGGING
# ==========================================
logging.level.com.careernavigator=DEBUG

# ==========================================
# GEMINI AI CONFIG
# ==========================================
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent



# CORS Settings
spring.mvc.cors.allowed-origins=*
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*

# ==========================================
# FASTAPI PYTHON ML BACKEND CONFIG
# ==========================================
ml.backend.url=http://localhost:8000/api/v1

