services:
  - type: web
    name: ai-career-navigator
    env: python
    plan: free
    buildCommand: pip install --upgrade pip && (if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; else pip install -r requirements.txt; fi)
    startCommand: sh -c "if [ -d backend ]; then cd backend; fi; exec uvicorn app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROK_API_KEY
        sync: false
